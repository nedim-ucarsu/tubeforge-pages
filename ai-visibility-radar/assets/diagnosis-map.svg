<line x1="395" y1="210" x2="381" y2="124" stroke="#345375" stroke-width="2"/><rect x="290" y="54" width="212" height="78" rx="16" fill="#11273d" stroke="#2d4b69"/><circle cx="316" cy="82" r="10" fill="#b197fc"/><text x="337" y="87" fill="#eef6ff" font-weight="700">Marka kimliği</text><text x="316" y="113" fill="#9fb0c6" font-size="13">Bilgiler tutarlı mı?</text>
<line x1="503" y1="229" x2="592" y2="155" stroke="#345375" stroke-width="2"/><rect x="558" y="104" width="218" height="78" rx="16" fill="#11273d" stroke="#2d4b69"/><circle cx="584" cy="132" r="10" fill="#63e6be"/><text x="605" y="137" fill="#eef6ff" font-weight="700">İçerik uyumu</text><text x="584" y="163" fill="#9fb0c6" font-size="13">Gerçek soruları karşılıyor mu?</text>
<line x1="521" y1="378" x2="620" y2="432" stroke="#345375" stroke-width="2"/><rect x="584" y="420" width="220" height="78" rx="16" fill="#11273d" stroke="#2d4b69"/><circle cx="610" cy="448" r="10" fill="#ffd166"/><text x="631" y="453" fill="#eef6ff" font-weight="700">Otorite ve güven</text><text x="610" y="479" fill="#9fb0c6" font-size="13">Bağımsız kanıt yeterli mi?</text>
<line x1="390" y1="458" x2="366" y2="525" stroke="#345375" stroke-width="2"/><rect x="260" y="500" width="228" height="78" rx="16" fill="#11273d" stroke="#2d4b69"/><circle cx="286" cy="528" r="10" fill="#ff922b"/><text x="307" y="533" fill="#eef6ff" font-weight="700">Kaynak görünürlüğü</text><text x="286" y="559" fill="#9fb0c6" font-size="13">AI hangi siteleri kullanıyor?</text>
<line x1="323" y1="397" x2="218" y2="455" stroke="#345375" stroke-width="2"/><rect x="58" y="428" width="198" height="78" rx="16" fill="#11273d" stroke="#2d4b69"/><circle cx="84" cy="456" r="10" fill="#ff6b6b"/><text x="105" y="461" fill="#eef6ff" font-weight="700">Rakip farkı</text><text x="84" y="487" fill="#9fb0c6" font-size="13">Rakip nerede avantajlı?</text>
</g>

<path d="M692 326 C735 326 756 326 796 326" fill="none" stroke="url(#g)" stroke-width="5"/><path d="M786 313 L805 326 L786 339" fill="none" stroke="#63e6be" stroke-width="5" stroke-linecap="round"/>
