<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">AI Visibility Radar kök neden teşhis haritası</title>
<desc id="d">Altı teşhis alanını merkezdeki kök neden analizine ve öncelikli düzeltme reçetesine bağlayan temsili şema.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0a1728"/><stop offset="1" stop-color="#10253d"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#63e6be"/><stop offset="1" stop-color="#74c0fc"/></linearGradient></defs>
<rect width="1200" height="620" rx="32" fill="url(#bg)"/>
<text x="60" y="66" fill="#eef6ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Kök nedeni nasıl buluyoruz?</text>
<text x="60" y="96" fill="#9fb0c6" font-family="Arial,sans-serif" font-size="16">Tek bir skor yerine, görünürlüğü etkileyen altı alanı birlikte değerlendiriyoruz.</text>

<circle cx="430" cy="335" r="126" fill="#0f1d31" stroke="#345375" stroke-width="2"/>
<circle cx="430" cy="335" r="78" fill="url(#g)" opacity=".12" stroke="#63e6be" stroke-width="2"/>
<text x="430" y="325" text-anchor="middle" fill="#eef6ff" font-family="Arial,sans-serif" font-weight="700" font-size="25">KÖK NEDEN</text>
<text x="430" y="355" text-anchor="middle" fill="#9fb0c6" font-family="Arial,sans-serif" font-size="15">ölçüm + site + kaynak</text>

<g font-family="Arial,sans-serif" font-size="16">
