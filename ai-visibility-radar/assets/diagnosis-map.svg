<rect x="858" y="308" width="248" height="62" rx="14" fill="#332d1d"/><text x="878" y="334" fill="#ffe29a" font-size="13" font-weight="700">YÜKSEK</text><text x="878" y="356" fill="#eef6ff" font-size="16">İçerik açığını kapat</text>
<rect x="858" y="384" width="248" height="62" rx="14" fill="#18313a"/><text x="878" y="410" fill="#a7f3d0" font-size="13" font-weight="700">YÜKSEK</text><text x="878" y="432" fill="#eef6ff" font-size="16">Kaynak kapsamasını artır</text>
<rect x="858" y="460" width="248" height="36" rx="12" fill="#15273f"/><text x="982" y="484" text-anchor="middle" fill="#74c0fc" font-size="14" font-weight="700">→ Aynı sorgularla yeniden ölç</text>
