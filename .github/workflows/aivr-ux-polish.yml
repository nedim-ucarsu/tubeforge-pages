name: Apply AIVR UX polish

on:
  push:
    branches:
      - aivr-ux-polish-20260919
    paths:
      - '.aivr-polish.py'
      - '.github/workflows/aivr-ux-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply polish
        run: python .aivr-polish.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check ai-visibility-radar/app.js
          python -m json.tool ai-visibility-radar/product-truth.json >/dev/null
          grep -q 'id="quick-website"' ai-visibility-radar/index.html
          grep -q 'Web Sitesi Adresi <em>OPSİYONEL</em>' ai-visibility-radar/index.html
          if grep -E 'id="(quick-website|website)"[^>]*required' ai-visibility-radar/index.html; then exit 1; fi
          grep -q 'Eksik veriyi tahmin etmiyoruz' ai-visibility-radar/index.html
          grep -q 'Geçerli bir web sitesi adresi girin veya alanı boş bırakın' ai-visibility-radar/app.js
          grep -q 'grid-template-columns:repeat(4,minmax(0,1fr))' ai-visibility-radar/styles.css

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .aivr-polish.py
          git rm .github/workflows/aivr-ux-polish.yml
          git add ai-visibility-radar/index.html ai-visibility-radar/styles.css ai-visibility-radar/app.js
          git commit -m 'Polish AIVR landing UX and optional website flow'
          git push origin HEAD:aivr-ux-polish-20260919
