name: Assemble AIVR landing staging

on:
  push:
    branches: [aivr-shell-final-20260919]
    paths:
      - '.github/workflows/aivr-stage-deploy.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble validated static landing
        shell: bash
        run: |
          set -euo pipefail
          cat .aivr-stage/part-* > /tmp/aivr.b64
          base64 -d /tmp/aivr.b64 > /tmp/aivr.tgz
          test "$(wc -c < /tmp/aivr.tgz)" -eq 19549
          tar -tzf /tmp/aivr.tgz
          tar -xzf /tmp/aivr.tgz -C ai-visibility-radar

          node --check ai-visibility-radar/app.js
          python -m json.tool ai-visibility-radar/product-truth.json >/dev/null
          grep -q 'product-version" content="1.8.6.9' ai-visibility-radar/index.html
          grep -q 'formsubmit.co/ajax/' ai-visibility-radar/app.js
          grep -q 'Web Sitesi <em>OPSİYONEL' ai-visibility-radar/index.html
          test -f ai-visibility-radar/privacy.html
          test -f ai-visibility-radar/kvkk.html
          test -f ai-visibility-radar/terms.html
          test -f ai-visibility-radar/thanks.html
          test -f ai-visibility-radar/sample-report.html
          test -f ai-visibility-radar/assets/aivr-og-1200x630.png

          ! grep -RIE 'ChatGPT 4o|Claude 3\.5|Apple Intelligence|v2\.6 ENGINE|\+%240|2\.8x|%100 Gizli|30 Saniyede|5 Farklı AI Motorunda' ai-visibility-radar
          ! grep -RIE 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{16,}|C:\\Users\\|C:\\AI_VISIBILITY_RADAR\\' ai-visibility-radar

      - name: Commit clean staging result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .aivr-stage
          git rm .github/workflows/aivr-stage-deploy.yml
          git add ai-visibility-radar
          git commit -m 'Deploy AIVR shell-based professional landing page'
          git push origin HEAD:aivr-shell-final-20260919
