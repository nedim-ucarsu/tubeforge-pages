name: Fix AIVR submission truth

on:
  push:
    branches: [aivr-submission-truth-20260919]
    paths:
      - '.aivr-submission-fix.py'
      - '.github/workflows/aivr-submission-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python .aivr-submission-fix.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check ai-visibility-radar/app.js
          grep -q "Talep ID" ai-visibility-radar/app.js
          grep -q "Sayfa Adresi" ai-visibility-radar/app.js
          grep -q "submission-receipt" ai-visibility-radar/index.html
          grep -q "Bu kayıt bir teslim alındı belgesidir" ai-visibility-radar/index.html
          grep -q "gerçek rapor ancak AIVR ölçüm motoru" ai-visibility-radar/thanks.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .aivr-submission-fix.py
          git rm .github/workflows/aivr-submission-fix.yml
          git add ai-visibility-radar/index.html ai-visibility-radar/app.js ai-visibility-radar/styles.css ai-visibility-radar/thanks.html
          git commit -m 'Fix AIVR submission feedback and source URL'
          git push origin HEAD:aivr-submission-truth-20260919
